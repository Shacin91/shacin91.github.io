<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AHP Research Utility</title>
    <!-- Load Plotly for Graphs -->
    <script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; padding: 20px; max-width: 800px; margin: auto; }
        .matrix-input { width: 60px; padding: 5px; }
        table { border-collapse: collapse; margin: 20px 0; }
        td { padding: 5px; }
        .consistent { color: green; font-weight: bold; }
        .inconsistent { color: red; font-weight: bold; }
        #chart { width: 100%; height: 400px; margin-top: 30px; }
    </style>
<meta name="page-last-updated" content="2026-11-09T00:05:38+06:00">
</head>
<body>
    <h1>AHP Calculation Tool</h1>
    <label>Criteria Count: </label>
    <input type="number" id="n" value="3" min="2" max="10">
    <button onclick="createMatrix()">Generate Matrix</button>

    <div id="matrixArea"></div>
    <div id="status" class="status"></div>
    <div id="chart"></div>

        <p class="page-last-updated" style="max-width:1120px;margin:2.8em auto 14px;padding:0 20px;text-align:left;color:#78848a;font:400 .78rem/1.5 Arial,sans-serif">Last Updated: <time></time></p>
    <script>
    (()=>{const meta=document.querySelector('meta[name="page-last-updated"]');const p=document.querySelector('.page-last-updated');const time=p&&p.querySelector('time');if(!meta||!time)return;const date=new Date(meta.content);time.dateTime=meta.content;const timeText=new Intl.DateTimeFormat('en-GB',{timeZone:'Asia/Dhaka',hour:'numeric',minute:'2-digit',hour12:true}).format(date);const dateText=new Intl.DateTimeFormat('en-GB',{timeZone:'Asia/Dhaka',day:'numeric',month:'long'}).format(date);time.textContent=timeText+', '+dateText+' (BST)'})();
    </script>
